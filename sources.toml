# Fuentes editables sin tocar código.
# fast = trampa ⚡ (página 1, menor a mayor precio, cada ciclo rápido de ~2 min)
# fast_every/fast_offset = la trampa corre 1 de cada N ciclos (rotación para no saturar)
# runners = dónde corre: "cloud" (GitHub Actions), "chile" (nodo opcional), "local"

[store_defaults.santaisabel]
runners = ["cloud", "chile", "local"]
max_pages = 60

[store_defaults.acuenta]
runners = ["cloud", "chile", "local"]
max_pages = 40

[store_defaults.lider]
runners = ["cloud", "chile", "local"]
max_pages = 25

[store_defaults.jumbo]
runners = ["cloud", "chile", "local"]
max_pages = 80

[store_defaults.alvi]
# mayorista SMU: Akamai bloquea las IPs de GitHub (403) -> solo nodo Chile
runners = ["chile", "local"]
max_pages = 40

[store_defaults.tottus]
# Requiere autorización del socio: llave en el GitHub Secret TOTTUS_PARTNER_TOKEN
# (sin ella estas fuentes no se activan). Ver docs/TOTTUS_INTEGRACION.md
runners = ["cloud", "chile", "local"]
max_pages = 40

[store_defaults.unimarc]
# Akamai bloquea las IPs de GitHub (403): solo nodo en Chile
runners = ["chile", "local"]
max_pages = 60

