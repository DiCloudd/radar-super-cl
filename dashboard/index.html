<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Radar Súper">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Radar Súper</title>
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--ink:#121418;--mut:#646c79;--line:#e4e7ec;--acc:#0a7d4f;--acc2:#e3f3ec;
  --warn:#c2261d;--warn2:#fdecea;--gold:#9a6700;--gold2:#fff4d6;--chip:#eceef2;--bar:rgba(255,255,255,.92);
  --lider:#0071ce;--santaisabel:#d6001c;--acuenta:#e65100;--unimarc:#c4161c;--tottus:#00a651;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1013;--card:#181b20;--ink:#eceff3;--mut:#9aa3b0;--line:#272b32;--acc:#3ddc97;--acc2:#12301f;
  --warn:#ff8a80;--warn2:#3a1d1b;--gold:#ffcc4d;--gold2:#3a2e10;--chip:#22262d;--bar:rgba(24,27,32,.92)}}
:root[data-theme="dark"]{--bg:#0e1013;--card:#181b20;--ink:#eceff3;--mut:#9aa3b0;--line:#272b32;--acc:#3ddc97;
  --acc2:#12301f;--warn:#ff8a80;--warn2:#3a1d1b;--gold:#ffcc4d;--gold2:#3a2e10;--chip:#22262d;--bar:rgba(24,27,32,.92)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 8px}
h1{font-size:28px;margin:0 0 2px;letter-spacing:-.5px}
.sub{color:var(--mut);font-size:13px}
main{padding:4px 16px calc(env(safe-area-inset-bottom) + 90px);max-width:760px;margin:0 auto}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px;margin-top:10px}
.search input{flex:1;border:0;background:transparent;color:var(--ink);font-size:17px;padding:12px 0;outline:none;min-width:0}
.search button{border:0;background:var(--chip);border-radius:999px;width:26px;height:26px;color:var(--mut)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{opacity:.7;font-weight:500}
.sec{display:flex;align-items:baseline;gap:8px;margin:18px 2px 8px}
.sec h2{font-size:19px;margin:0}
.sec span{color:var(--mut);font-size:13px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.g{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;min-width:0}
.gh{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.gh img{width:58px;height:58px;object-fit:contain;border-radius:10px;background:#fff;flex:none}
.nm{font-size:15px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.why{font-size:12.5px;color:var(--mut);margin-top:2px}
.rows{margin-top:8px}
.r{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:14.5px;cursor:pointer}
.r:first-child{border-top:0}
.r .pz{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.r .pz s{display:block;font-weight:400;color:var(--mut);font-size:11.5px}
.r.best .pz{color:var(--acc)}
.r .u{color:var(--mut);font-size:12px}
.st{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;color:#fff;white-space:nowrap}
.st.lider{background:var(--lider)}.st.santaisabel{background:var(--santaisabel)}.st.acuenta{background:var(--acuenta)}.st.unimarc{background:var(--unimarc)}.st.tottus{background:var(--tottus)}
.st.jumbo{background:#00953b}.st.alvi{background:#003da5}.st{background:#5b6472}
.why .tag{white-space:normal;display:inline-block;line-height:1.35}
.tag{font-size:11.5px;padding:2px 7px;border-radius:6px;background:var(--chip);color:var(--mut);white-space:nowrap;font-weight:600}
.tag.g2{background:var(--acc2);color:var(--acc)}.tag.r2{background:var(--warn2);color:var(--warn)}.tag.y2{background:var(--gold2);color:var(--gold)}
.foot{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.add{margin-left:auto;border:0;background:var(--acc2);color:var(--acc);font-weight:700;border-radius:10px;padding:7px 12px;font-size:14px}
.add.on{background:var(--acc);color:#fff}
.empty{color:var(--mut);padding:28px 8px;text-align:center}
.hint{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:12px;color:var(--mut);font-size:14px}
.tot{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.tile b{font-size:20px;display:block;font-variant-numeric:tabular-nums}.tile span{color:var(--mut);font-size:12.5px}
.tile.win{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.qty{display:flex;align-items:center;gap:6px}
.qty button{border:0;background:var(--chip);width:28px;height:28px;border-radius:8px;font-weight:700}
.more{display:block;margin:14px auto;border:0;background:var(--chip);border-radius:12px;padding:10px 16px;font-weight:700}
nav.tab{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--bar);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);
  border-top:1px solid var(--line);display:flex;padding:6px 6px calc(env(safe-area-inset-bottom) + 6px)}
nav.tab button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;font-weight:600;color:var(--mut);padding:4px 0}
nav.tab button i{font-style:normal;font-size:22px;line-height:1.1}
nav.tab button.on{color:var(--ink)}
nav.tab .badge{position:relative}
nav.tab .badge b{position:absolute;top:-2px;right:-12px;background:var(--warn);color:#fff;border-radius:999px;font-size:10px;padding:1px 5px}
dialog{border:0;border-radius:20px;padding:0;width:min(560px,94vw);max-height:88vh;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{padding:16px}
.dlg img.big{width:120px;height:120px;object-fit:contain;background:#fff;border-radius:12px}
.btn{display:inline-block;border:0;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;font-weight:700;font-size:15px;text-decoration:none}
.btn.s{background:var(--chip);color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:7px 5px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.row .sp{margin-left:auto}
.mut{color:var(--mut)}.ok{color:var(--acc)}.bad{color:var(--warn)}
</style>
</head>
<body>
<header>
  <h1 id="title">Buscar</h1>
  <div class="sub" id="upd">cargando…</div>
</header>
<main id="main"><div class="empty">Cargando…</div></main>

<nav class="tab" id="tabs">
  <button data-t="buscar"><i>🔎</i>Buscar</button>
  <button data-t="ofertas"><i class="badge">🔥<b id="nerr" hidden></b></i>Ofertas</button>
  <button data-t="canasta"><i class="badge">🛒<b id="nbas" hidden></b></i>Canasta</button>
  <button data-t="mas"><i>⋯</i>Más</button>
</nav>
<dialog id="dlg"><div class="dlg" id="dlgb"></div></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const fmt = n => n == null ? "—" : "$" + Math.round(n).toLocaleString("es-CL");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const LS = {
  get(k, d){ try{ const v = localStorage.getItem("radar:" + k); return v == null ? d : JSON.parse(v); }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem("radar:" + k, JSON.stringify(v)); }catch{} }
};
let D = null, ALL = null, BY = {}, GM = {}, tab = LS.get("tab2", "buscar"), card = LS.get("card", false);
const TITLES = {buscar: "Buscar", ofertas: "Ofertas", canasta: "Mi canasta", mas: "Más"};

function applyTheme(){ const t = LS.get("theme", null); if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
applyTheme();

// ---------- datos ----------
function index(list){ for (const p of list){ if (!BY[p.k] || !BY[p.k].h) BY[p.k] = p; if (p.g) (GM[p.g] = GM[p.g] || new Set()).add(p.k); } }
// ---------- acceso por dispositivo (cifrado de extremo a extremo) ----------
const ENC = new TextEncoder();
const B32 = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const b64u = b => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const unb64u = s => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4)), c => c.charCodeAt(0));
function idb(){ return new Promise((ok, ko) => { const r = indexedDB.open("radar-access", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("k"); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); }); }
async function idbGet(k){ const db = await idb(); return new Promise(ok => { const r = db.transaction("k").objectStore("k").get(k); r.onsuccess = () => ok(r.result); r.onerror = () => ok(null); }); }
async function idbPut(k, v){ const db = await idb(); return new Promise(ok => { const t = db.transaction("k", "readwrite"); t.objectStore("k").put(v, k); t.oncomplete = ok; t.onerror = ok; }); }
function deviceDesc(){
  const ua = navigator.userAgent;
  const dev = /iPhone/.test(ua) ? "iPhone" : /iPad/.test(ua) ? "iPad" : /Android/.test(ua) ? "Android" : /Mac/.test(ua) ? "Mac" : /Windows/.test(ua) ? "Windows" : "Otro";
  const br = /CriOS|Chrome/.test(ua) && !/Edg/.test(ua) ? "Chrome" : /Edg/.test(ua) ? "Edge" : /FxiOS|Firefox/.test(ua) ? "Firefox" : /Safari/.test(ua) ? "Safari" : "Navegador";
  const app = matchMedia("(display-mode: standalone)").matches || navigator.standalone ? " · app instalada" : "";
  return `${dev} · ${br}${app}`;
}
let ME = null;
async function myDevice(){
  if (ME) return ME;
  let k = await idbGet("dev");
  if (!k){
    const kp = await crypto.subtle.generateKey({name: "ECDH", namedCurve: "P-256"}, false, ["deriveBits"]);   // privada NO exportable
    k = {priv: kp.privateKey, pub: new Uint8Array(await crypto.subtle.exportKey("raw", kp.publicKey))};
    await idbPut("dev", k);
  }
  const h = new Uint8Array(await crypto.subtle.digest("SHA-256", k.pub));
  let n = 0n; for (let i = 0; i < 5; i++) n = (n << 8n) | BigInt(h[i]);
  let s = ""; for (let i = 0; i < 8; i++) s = B32[Number((n >> BigInt(5 * i)) & 31n)] + s;
  ME = {...k, id: s.slice(0, 4) + "-" + s.slice(4), desc: deviceDesc()};
  ME.request = `RADAR1.${b64u(ENC.encode(ME.desc))}.${b64u(k.pub)}`;
  return ME;
}
let DKEY = null;
async function dataKey(){
  const me = await myDevice();
  const keys = await (await fetch("keys.json?t=" + Date.now(), {cache: "no-store"})).json();
  const w = keys.devices[me.id];
  if (!w) return null;
  const epk = await crypto.subtle.importKey("raw", unb64u(w.epk), {name: "ECDH", namedCurve: "P-256"}, false, []);
  const shared = await crypto.subtle.deriveBits({name: "ECDH", public: epk}, me.priv, 256);
  const base = await crypto.subtle.importKey("raw", shared, "HKDF", false, ["deriveKey"]);
  const wk = await crypto.subtle.deriveKey({name: "HKDF", hash: "SHA-256", salt: ENC.encode("radar-super-salt-v1"), info: ENC.encode("radar-super-wrap-v1")},
    base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  const raw = await crypto.subtle.decrypt({name: "AES-GCM", iv: unb64u(w.iv), additionalData: ENC.encode(me.id)}, wk, unb64u(w.ct));
  return crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
}
async function openSealed(name){
  const blob = new Uint8Array(await (await fetch(name.replace(".json", ".bin") + "?t=" + Date.now(), {cache: "no-store"})).arrayBuffer());
  const gz = await crypto.subtle.decrypt({name: "AES-GCM", iv: blob.slice(0, 12), additionalData: ENC.encode(name)}, DKEY, blob.slice(12));
  const stream = new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(stream).text());
}
async function lockScreen(){
  const me = await myDevice();
  document.querySelector("nav.tab").hidden = true;
  $("#title").textContent = "🔒 Acceso restringido";
  $("#upd").textContent = "Esta app es privada";
  $("#main").innerHTML = `<div class="hint" style="color:var(--ink);border-style:solid">
      Este dispositivo aún no está autorizado. Envía tu solicitud al administrador para que la apruebe.</div>
    <div class="g" style="margin-top:12px;text-align:center"><div class="mut" style="font-size:13px">Código de este dispositivo</div>
      <div style="font-size:34px;font-weight:800;letter-spacing:2px;margin:6px 0">${esc(me.id)}</div>
      <div class="mut" style="font-size:13px">${esc(me.desc)}</div>
      <p style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px">
        <button class="btn" id="share">Enviar solicitud</button><button class="btn s" id="copy">Copiar</button><button class="btn s" id="retry">Reintentar</button></p></div>
    <p class="mut" style="font-size:13px">Una vez aprobado, se activa en la próxima actualización de datos (máx. ~25 min).
    Si instalas la app en la pantalla de inicio, tendrá un código distinto: apruébalo también.</p>`;
  $("#copy").onclick = async () => { try { await navigator.clipboard.writeText(me.request); toast("Solicitud copiada"); } catch { prompt("Copia esta solicitud:", me.request); } };
  $("#share").onclick = async () => { if (navigator.share) { try { await navigator.share({text: me.request}); } catch {} } else $("#copy").click(); };
  $("#retry").onclick = () => location.reload();
}

async function load(){
  try { DKEY = await dataKey(); } catch (e) { DKEY = null; }
  if (!DKEY) return lockScreen();
  document.querySelector("nav.tab").hidden = false;
  D = await openSealed("data.json");
  index(D.core);
  const ago = Math.max(0, Math.round((Date.now() - new Date(D.generated)) / 60000));
  $("#upd").textContent = `Actualizado hace ${ago < 1 ? "menos de 1" : ago} min · ${D.counts.products.toLocaleString("es-CL")} productos · ${Object.keys(D.stores).length} cadenas`;
  const ne = D.errors.length + D.godzilla.length; if (ne) { $("#nerr").textContent = ne; $("#nerr").hidden = false; }
  badge(); render();
}
let allP = null;
function loadAll(){ return allP || (allP = openSealed("products.json").then(j => { ALL = j.products; index(ALL); return ALL; })); }
const price = p => (card && p.c && p.c < p.p) ? p.c : p.p;
const SN = s => (D && D.health[s] && D.health[s].name) || s;
const members = p => p.g && GM[p.g] ? [...GM[p.g]].map(k => BY[k]).filter(Boolean) : [p];

// ---------- tarjeta de producto comparado ----------
function groupCard(p, extra = ""){
  let ms = members(p).filter(x => !x.mk);
  if (!ms.length) ms = [p];   // solo vendedores externos: igual se muestra (antes rompía la lista)
  const byStore = {}; for (const x of ms) if (!byStore[x.s] || price(x) < price(byStore[x.s])) byStore[x.s] = x;
  const rows = Object.values(byStore).sort((a, b) => price(a) - price(b));
  const img = rows.find(x => x.img)?.img;
  const save = rows.length > 1 ? price(rows[rows.length - 1]) - price(rows[0]) : 0;
  const inB = basket().some(b => rows.some(x => x.k === b.k));
  return `<div class="g">
    <div class="gh" data-open="${esc(rows[0].k)}">${img ? `<img loading="lazy" src="${esc(img)}" alt="">` : ""}
      <div style="min-width:0"><div class="nm">${esc(rows[0].n)}</div>${extra}</div></div>
    <div class="rows">${rows.map((x, i) => `<div class="r ${i === 0 && rows.length > 1 ? "best" : ""}" data-open="${esc(x.k)}">
      <span class="st ${x.s}">${esc(SN(x.s))}</span>
      ${x.u ? `<span class="u">${fmt(x.u)}/${esc(x.un)}</span>` : ""}
      ${x.w ? `<span class="tag y2">≈${esc(x.w)} · peso variable</span>` : ""}
      ${x.mk ? `<span class="tag">otro vendedor</span>` : ""}
      ${x.st === 0 ? `<span class="tag r2">agotado</span>` : ""}
      ${!card && x.c ? `<span class="tag">💳 ${fmt(x.c)}</span>` : ""}
      <span class="pz">${fmt(price(x))}${x.l ? `<s>${fmt(x.l)}</s>` : ""}</span></div>`).join("")}</div>
    <div class="foot">${rows.length > 1 ? `<span class="tag g2">ahorras ${fmt(save)} en ${esc(SN(rows[0].s))}</span>` : `<span class="tag">solo en ${esc(SN(rows[0].s))}</span>`}
      <button class="add ${inB ? "on" : ""}" data-add="${esc(rows[0].k)}">${inB ? "✓ En canasta" : "+ Canasta"}</button></div></div>`;
}
function dedupe(list){ const seen = new Set(), out = []; for (const p of list){ const id = p.g || p.k; if (!seen.has(id)){ seen.add(id); out.push(p); } } return out; }
// una tarjeta por producto aunque varias cadenas tengan hallazgo en el mismo grupo
function dedupeF(list){ const seen = new Set(), out = []; for (const f of list){ const p = BY[f.k]; if (!p) continue; const id = p.g || p.k; if (!seen.has(id)){ seen.add(id); out.push(f); } } return out; }
function paged(el, list, makeCard, n = 30){
  let shown = n;
  const draw = () => { el.innerHTML = list.length ? `<div class="list">${list.slice(0, shown).map(makeCard).join("")}</div>`
      + (list.length > shown ? `<button class="more">Ver más (${list.length - shown})</button>` : "") : `<div class="empty">Nada por aquí.</div>`;
    const m = el.querySelector(".more"); if (m) m.onclick = () => { shown += n; draw(); }; };
  draw();
}

// ---------- 🔎 BUSCAR ----------
const SUG = ["pañales", "leche", "aceite", "detergente", "whisky", "pisco", "cerveza", "coca cola", "papel higiénico", "arroz", "shampoo", "café", "pollo", "atún"];
async function buscar(){
  const q = LS.get("q", ""), stores = LS.get("fstores", []), stock = LS.get("fstock", false), sort = LS.get("fsort", "rel");
  $("#main").innerHTML = `
    <div class="search"><span>🔎</span><input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off"
      placeholder="Busca un producto: leche, pañales, pisco…" value="${esc(q)}"><button id="qx" ${q ? "" : "hidden"}>✕</button></div>
    <div class="chips" id="fs">${Object.entries(D.stores).map(([k, v]) => `<button class="chip ${stores.includes(k) ? "on" : ""}" data-st="${k}">${esc(v)}</button>`).join("")}
      <button class="chip ${stock ? "on" : ""}" id="fstock">Con stock</button>
      <button class="chip" id="fsort">${{rel: "↕ Relevancia", price: "↕ Menor precio", unit: "↕ Menor $/unidad", save: "↕ Mayor ahorro"}[sort]}</button></div>
    <div id="res"></div>`;
  const inp = $("#q");
  let t = null;
  inp.oninput = () => { LS.set("q", inp.value); $("#qx").hidden = !inp.value; clearTimeout(t); t = setTimeout(run, 180); };
  $("#qx").onclick = () => { inp.value = ""; LS.set("q", ""); $("#qx").hidden = true; run(); inp.focus(); };
  document.querySelectorAll("[data-st]").forEach(b => b.onclick = () => { const s = LS.get("fstores", []); const i = s.indexOf(b.dataset.st);
    i >= 0 ? s.splice(i, 1) : s.push(b.dataset.st); LS.set("fstores", s); b.classList.toggle("on"); run(); });
  $("#fstock").onclick = e => { LS.set("fstock", !LS.get("fstock", false)); e.target.classList.toggle("on"); run(); };
  $("#fsort").onclick = e => { const o = ["rel", "price", "unit", "save"]; const n = o[(o.indexOf(LS.get("fsort", "rel")) + 1) % o.length];
    LS.set("fsort", n); e.target.textContent = {rel: "↕ Relevancia", price: "↕ Menor precio", unit: "↕ Menor $/unidad", save: "↕ Mayor ahorro"}[n]; run(); };
  run();
}
async function run(){
  const el = $("#res"); if (!el) return;
  const q = norm(LS.get("q", "")).trim();
  if (!q){
    const top = dedupe(D.compare.slice(0, 40).map(c => BY[c.keys[0]]).filter(Boolean));
    el.innerHTML = `<div class="chips">${SUG.map(s => `<button class="chip" data-sug="${esc(s)}">${esc(s)}</button>`).join("")}</div>
      <div class="sec"><h2>Mayor diferencia entre cadenas</h2><span>mismo producto</span></div><div id="top"></div>`;
    el.querySelectorAll("[data-sug]").forEach(b => b.onclick = () => { $("#q").value = b.dataset.sug; LS.set("q", b.dataset.sug); $("#qx").hidden = false; run(); });
    paged($("#top"), top, p => groupCard(p), 12);
    loadAll();   // precarga el catálogo en segundo plano
    return;
  }
  if (!ALL) el.innerHTML = `<div class="empty">Cargando catálogo completo…</div>`;
  await loadAll();
  if (norm(LS.get("q", "")).trim() !== q) return;
  const words = q.split(/\s+/).filter(Boolean);
  const stores = LS.get("fstores", []), stock = LS.get("fstock", false), sort = LS.get("fsort", "rel");
  let hits = ALL.filter(p => !p.mk && words.every(w => norm(p.n + " " + (p.b || "")).includes(w))
    && (!stores.length || members(p).some(x => stores.includes(x.s))) && (!stock || p.st !== 0));
  hits = dedupe(hits);
  const nst = p => new Set(members(p).map(x => x.s)).size;
  const minp = p => Math.min(...members(p).map(price));
  const unitp = p => Math.min(...members(p).map(x => x.u || 1e12));
  const savep = p => { const ps = members(p).map(price); return Math.max(...ps) - Math.min(...ps); };
  const starts = p => norm(p.n).startsWith(words[0]) ? 0 : 1;
  const key = {rel: p => [-nst(p), starts(p), minp(p)], price: p => [minp(p)], unit: p => [unitp(p)], save: p => [-savep(p)]}[sort];
  hits.sort((a, b) => { const x = key(a), y = key(b); for (let i = 0; i < x.length; i++) if (x[i] !== y[i]) return x[i] - y[i]; return 0; });
  const cmp = hits.filter(p => nst(p) > 1).length;
  el.innerHTML = `<div class="sec"><h2>${hits.length.toLocaleString("es-CL")} resultados</h2><span>${cmp} comparados entre cadenas</span></div><div id="hl"></div>`;
  paged($("#hl"), hits, p => groupCard(p));
}

// ---------- 🔥 OFERTAS ----------
function ofertas(){
  const sec = LS.get("osec", D.errors.length ? "errores" : "gangas");
  const C = D.counts;
  const tabs = [["errores", "💥 Errores", D.errors.length + D.godzilla.length], ["gangas", "🔥 Gangas", D.gangas.length],
    ["bajadas", "⚡ Bajaron", D.drops.length], ["descuentos", "🏷️ Descuentos", D.offers.length]];
  $("#main").innerHTML = `<div class="chips">${tabs.map(([k, t, n]) => `<button class="chip ${sec === k ? "on" : ""}" data-sec="${k}">${t} <small>${n}</small></button>`).join("")}</div><div id="ol"></div>`;
  document.querySelectorAll("[data-sec]").forEach(b => b.onclick = () => { LS.set("osec", b.dataset.sec); ofertas(); });
  const el = $("#ol");
  const why = (t, cls = "r2") => `<div class="why"><span class="tag ${cls}">${esc(t)}</span></div>`;
  if (sec === "errores"){
    const list = [...D.errors.map(f => ({...f, kind: "💥 Posible error"})), ...D.godzilla.map(f => ({...f, kind: "🦖 Godzilla"}))];
    el.innerHTML = `<div class="hint">Reglas estrictas: el producto <b>bajó de verdad</b> frente a su propio historial y quedó muy por debajo del mismo producto en otras cadenas. Aun así revisa en la tienda antes de comprar: puede corregirse en minutos.</div><div id="el" style="margin-top:10px"></div>`;
    if (!list.length) $("#el").innerHTML = `<div class="empty">Sin errores de precio ahora mismo. 👀 El radar revisa cada ~2 minutos.</div>`;
    else paged($("#el"), dedupeF(list), f => groupCard(BY[f.k], why(`${f.kind} · ${f.why}`)));
  } else if (sec === "gangas"){
    paged(el, dedupeF(D.gangas), f => groupCard(BY[f.k], why(`🔥 ${f.pct}% más barato que en otras cadenas`, "g2")));
  } else if (sec === "bajadas"){
    const ds = dedupeF(D.drops);
    if (!ds.length) el.innerHTML = `<div class="empty">Aún sin bajadas en las últimas 48 h.</div>`;
    else paged(el, ds, d => groupCard(BY[d.k], why(`⚡ bajó ${d.pct}% desde ${fmt(d.old)}`, "y2")));
  } else {
    el.innerHTML = `<div class="hint">Descuento que declara la tienda sobre su "precio normal" (a veces inflado). Para ahorro real mira 🔥 Gangas.</div><div id="dl" style="margin-top:10px"></div>`;
    paged($("#dl"), dedupe(D.offers.map(k => BY[k]).filter(Boolean)), p => groupCard(p, why(`-${Math.round(100 * (1 - p.p / p.l))}% vs normal ${fmt(p.l)}`, "g2")));
  }
}

// ---------- 🛒 CANASTA ----------
const basket = () => LS.get("basket2", []);
function setBasket(b){ LS.set("basket2", b); badge(); }
function badge(){ const n = basket().length; $("#nbas").textContent = n; $("#nbas").hidden = !n; }
function addBasket(k){
  const b = basket(); const p = BY[k]; const ids = new Set(members(p).map(x => x.k));
  const i = b.findIndex(x => ids.has(x.k));
  if (i >= 0) { b.splice(i, 1); toast("Quitado de la canasta"); } else { b.push({k, q: 1}); toast("Agregado a la canasta"); }
  setBasket(b);
}
async function canasta(){
  const b = basket();
  if (!b.length){ $("#main").innerHTML = `<div class="empty">🛒<br><br>Tu canasta está vacía.<br>Busca productos en 🔎 y toca <b>+ Canasta</b>.<br>Te diré en qué cadena sale más barata completa.</div>`; return; }
  if (b.some(x => !BY[x.k])) await loadAll();
  const stores = Object.keys(D.stores);
  const items = b.map(x => ({...x, p: BY[x.k]})).filter(x => x.p);
  const tot = Object.fromEntries(stores.map(s => [s, {sum: 0, n: 0}]));
  let mix = 0;
  const rows = items.map(it => {
    const per = {}; for (const x of members(it.p)) if (!x.mk && x.st !== 0 && (!per[x.s] || price(x) < price(per[x.s]))) per[x.s] = x;
    stores.forEach(s => { if (per[s]) { tot[s].sum += price(per[s]) * it.q; tot[s].n++; } });
    const vals = Object.values(per).map(price); const m = vals.length ? Math.min(...vals) : null;
    if (m != null) mix += m * it.q;
    return {...it, per, m};
  });
  const complete = stores.filter(s => tot[s].n === items.length).sort((a, c) => tot[a].sum - tot[c].sum);
  const best = complete[0], worst = complete[complete.length - 1];
  $("#main").innerHTML = `
    ${best ? `<div class="hint" style="border-style:solid;border-color:var(--acc);color:var(--ink)">🏆 Comprando todo en <b>${esc(SN(best))}</b> pagas <b>${fmt(tot[best].sum)}</b>${worst && worst !== best ? ` · ahorras ${fmt(tot[worst].sum - tot[best].sum)} vs ${esc(SN(worst))}` : ""}.</div>`
      : `<div class="hint">Ninguna cadena tiene todo. Mira el total combinado.</div>`}
    <div class="tot" style="margin-top:10px">${stores.map(s => `<div class="tile ${s === best ? "win" : ""}"><b>${tot[s].n ? fmt(tot[s].sum) : "—"}</b><span><span class="st ${s}">${esc(SN(s))}</span> ${tot[s].n}/${items.length}</span></div>`).join("")}
      <div class="tile"><b>${fmt(mix)}</b><span>cada cosa donde está más barata</span></div></div>
    <div class="sec"><h2>${items.length} productos</h2><span><a href="#" id="clr" class="mut">vaciar</a></span></div>
    ${rows.map(r => `<div class="g"><div class="gh" data-open="${esc(r.k)}"><div style="min-width:0;flex:1"><div class="nm">${esc(r.p.n)}</div>
        <div class="why">${Object.keys(r.per).length ? Object.entries(r.per).sort((a, c) => price(a[1]) - price(c[1])).map(([s, x]) => `<span class="${price(x) === r.m ? "ok" : ""}">${esc(SN(s))} ${fmt(price(x))}</span>`).join(" · ") : "sin stock en ninguna"}</div></div></div>
      <div class="foot"><div class="qty"><button data-q="${esc(r.k)}" data-d="-1">−</button><b>${r.q}</b><button data-q="${esc(r.k)}" data-d="1">+</button></div>
      <button class="add on" data-add="${esc(r.k)}">Quitar</button></div></div>`).join("")}`;
  $("#clr").onclick = e => { e.preventDefault(); if (confirm("¿Vaciar la canasta?")) { setBasket([]); canasta(); } };
}

  const h = D.health;
  $("#main").innerHTML = `
    <div class="row">💳 <div>Usar precio con tarjeta / club<div class="mut" style="font-size:13px">Mi Club Lider, Tarjeta Cencosud, Club Unimarc</div></div><button class="chip sp ${card ? "on" : ""}" id="tcard">${card ? "Sí" : "No"}</button></div>
    <div class="row">🌓 <div>Tema</div><button class="chip sp" id="ttheme">${{dark: "Oscuro", light: "Claro"}[LS.get("theme", null)] || "Automático"}</button></div>
    <div class="row">📲 <div style="font-size:14px">Instalar: en Safari toca <b>Compartir</b> → <b>Agregar a pantalla de inicio</b>.</div></div>
    <div class="sec"><h2>🩺 Cadenas</h2></div>
    ${Object.entries(h).map(([s, x]) => `<div class="row"><span class="st ${s}">${esc(x.name)}</span>
      <div style="font-size:14px;min-width:0">${x.products ? (x.blocked ? "⏸️ en pausa (" + esc(x.blocked.reason) + ")" : "✅ funcionando") : "⛔ no disponible"}
      <div class="mut" style="font-size:12.5px">${x.products ? x.products.toLocaleString("es-CL") + " productos · " + x.with_ean.toLocaleString("es-CL") + " con código de barras" : esc(x.note)}</div></div></div>`).join("")}
    <div class="sec"><h2>🔐 Dispositivos</h2><span>este: ${esc(ME ? ME.id : "")}</span></div>
    ${(D.devices || []).length ? `<table><tr><th>Código</th><th>Apodo / equipo</th><th>Estado</th></tr>${D.devices.map(d => `<tr><td><b>${esc(d.id)}</b>${ME && d.id === ME.id ? " (este)" : ""}</td><td>${esc(d.name || "—")}<div class="mut">${esc(d.desc)} · desde ${esc(d.added)}</div></td><td>${d.status === "ok" ? "✅ habilitado" : "⛔ bloqueado"}</td></tr>`).join("")}</table>` : ""}
    <p><a class="btn s" href="https://github.com/DiCloudd/radar-super-cl/actions/workflows/dispositivos.yml" target="_blank" rel="noopener">Aprobar o bloquear (GitHub)</a></p>
    <div class="sec"><h2>🏆 Salón de la fama</h2><span>errores detectados</span></div>
    ${D.hall.length ? `<table><tr><th>Producto</th><th>Precio</th><th>Duró</th></tr>${D.hall.slice(0, 30).map(e => { const p = BY[e.k]; const dur = e.ended ? Math.round((new Date(e.ended) - new Date(e.detected)) / 60000) + " min · " + esc(e.end_reason) : "🟢 sigue"; return `<tr><td>${esc(p ? p.n : e.k)}</td><td>${fmt(e.price)}<div class="mut">ref ${fmt(e.reference)}</div></td><td>${dur}</td></tr>`; }).join("")}</table>` : `<div class="empty">Aún sin errores registrados.</div>`}
    <div class="sec"><h2>⬇️ Exportar a Excel</h2></div>
    <p><button class="btn" id="e1">Ofertas</button> <button class="btn s" id="e2">Catálogo</button> <button class="btn s" id="e3">Canasta</button></p>
    <div class="sec"><h2>⏱️ Últimas ventanas</h2></div>
    <table><tr><th>Inicio</th><th>Peticiones</th><th>Cambios</th><th>Bloqueos</th></tr>${D.runs.map(r => `<tr><td>${new Date(r.started).toLocaleString("es-CL")}</td><td>${r.requests ?? "—"}</td><td>${r.changes ?? "—"}</td><td>${esc(r.blocked || "")}</td></tr>`).join("")}</table>`;
  $("#tcard").onclick = () => { card = !card; LS.set("card", card); mas(); };
  $("#ttheme").onclick = () => { const c = LS.get("theme", null); LS.set("theme", c === "dark" ? "light" : c === "light" ? null : "dark"); applyTheme(); mas(); };
  const csv = (list, name) => {
    const cols = ["cadena","producto","marca","ean","precio","precio_normal","precio_tarjeta","precio_unidad","unidad","stock","categoria","url"];
    const lines = [cols.join(";")].concat(list.map(p => [SN(p.s), p.n, p.b, p.e, p.p, p.l, p.c, p.u, p.un, p.st === 0 ? "no" : "si", p.cat, p.url].map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(";")));
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + lines.join("\n")], {type: "text/csv"})); a.download = name; a.click(); };
  $("#e1").onclick = () => csv(D.core, "radar-ofertas.csv");
  $("#e2").onclick = async () => csv(await loadAll(), "radar-catalogo.csv");
  $("#e3").onclick = async () => { await loadAll(); csv(basket().map(x => BY[x.k]).filter(Boolean), "radar-canasta.csv"); };
}

// ---------- ficha ----------
let chart = null;
function openProduct(k){
  const p = BY[k]; if (!p) return;
  const ms = members(p).sort((a, b) => price(a) - price(b));
  const hs = (p.h || []).map(x => x[1]);
  $("#dlgb").innerHTML = `<div style="display:flex;gap:12px">${p.img ? `<img class="big" src="${esc(p.img)}" alt="">` : ""}
    <div style="min-width:0"><div style="font-weight:700">${esc(p.n)}</div><div class="mut" style="font-size:13px">${esc(p.b || "")}${p.e ? " · EAN " + esc(p.e) : ""}</div>
    <div style="font-size:26px;font-weight:800;margin-top:4px">${fmt(p.p)} <span class="st ${p.s}" style="font-size:12px;vertical-align:middle">${esc(SN(p.s))}</span></div>
    <div class="foot" style="margin-top:2px">${p.l ? `<span class="tag">normal ${fmt(p.l)}</span>` : ""}${p.u ? `<span class="tag">${fmt(p.u)}/${esc(p.un)}</span>` : ""}${p.c ? `<span class="tag">💳 ${fmt(p.c)}</span>` : ""}${(p.pr || []).map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div></div></div>
    ${hs.length > 1 ? `<div class="mut" style="font-size:13px;margin-top:10px">Mínimo ${fmt(Math.min(...hs))} · Máximo ${fmt(Math.max(...hs))}</div><canvas id="ch" height="150"></canvas>` : `<p class="mut" style="font-size:13px">Historial en formación (visto desde ${esc(p.f || "hoy")}).</p>`}
    ${ms.length > 1 ? `<div class="sec"><h2>En todas las cadenas</h2></div><div class="rows">${ms.map((x, i) => `<a class="r ${i === 0 ? "best" : ""}" href="${esc(x.url)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none"><span class="st ${x.s}">${esc(SN(x.s))}</span><span class="u" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.n)}</span><span class="pz">${fmt(price(x))}</span></a>`).join("")}</div>` : ""}
    <p style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><a class="btn" href="${esc(p.url)}" target="_blank" rel="noopener">Ver en ${esc(SN(p.s))}</a>
    <button class="btn s" data-add="${esc(p.k)}">+ Canasta</button><button class="btn s" style="margin-left:auto" id="dclose">Cerrar</button></p>`;
  const dlg = $("#dlg"); dlg.showModal(); $("#dclose").onclick = () => dlg.close();
  if (chart) { chart.destroy(); chart = null; }
  if (hs.length > 1 && window.Chart) {
    const css = getComputedStyle(document.documentElement);
    chart = new Chart($("#ch"), {type: "line", data: {labels: p.h.map(x => x[0].replace("T", " ")), datasets: [{data: hs, stepped: true, borderColor: css.getPropertyValue("--acc").trim(), pointRadius: 2}]},
      options: {plugins: {legend: {display: false}}, scales: {x: {ticks: {maxTicksLimit: 4, color: css.getPropertyValue("--mut").trim()}}, y: {ticks: {color: css.getPropertyValue("--mut").trim(), callback: v => fmt(v)}}}}});
  }
}

// ---------- navegación ----------
function render(){
  if (!D) return;
  $("#title").textContent = TITLES[tab];
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === tab));
  ({buscar, ofertas, canasta, mas}[tab] || buscar)();
}
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { tab = b.dataset.t; LS.set("tab2", tab); render(); window.scrollTo(0, 0); });
function toast(t){ const d = document.createElement("div"); d.textContent = t;
  d.style.cssText = "position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 80px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:99;font-weight:600";
  document.body.appendChild(d); setTimeout(() => d.remove(), 1500); }
document.addEventListener("click", e => {
  const add = e.target.closest("[data-add]"); if (add){ e.stopPropagation(); addBasket(add.dataset.add);
    if (add.classList.contains("add") && tab !== "canasta"){ const on = !add.classList.contains("on"); add.classList.toggle("on", on); add.textContent = on ? "✓ En canasta" : "+ Canasta"; }
    if (tab === "canasta") canasta(); return; }
  const q = e.target.closest("[data-q]"); if (q){ const b = basket(); const it = b.find(x => x.k === q.dataset.q);
    if (it){ it.q = Math.max(1, it.q + (+q.dataset.d)); setBasket(b); canasta(); } return; }
  const o = e.target.closest("[data-open]"); if (o && !e.target.closest("a")) openProduct(o.dataset.open);
});
$("#dlg").addEventListener("click", e => { if (e.target.id === "dlg") e.target.close(); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
load().catch(e => { $("#main").innerHTML = `<div class="empty">No se pudieron cargar los datos (${esc(e.message)}).</div>`; });
</script>
